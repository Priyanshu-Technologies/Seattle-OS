<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Predictive Maintenance: failure probability gauge and XGBoost API service">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#191521"/><stop offset="1" stop-color="#2c2436"/></linearGradient>
    <radialGradient id="glow" cx=".2" cy=".1" r=".8"><stop offset="0" stop-color="#d8b56b" stop-opacity=".22"/><stop offset="1" stop-color="#d8b56b" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fc0a7"/><stop offset=".55" stop-color="#d8b56b"/><stop offset="1" stop-color="#d97a6a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/><rect width="800" height="450" fill="url(#glow)"/>
  <style>
    .k{font:500 9px 'DM Mono',monospace;letter-spacing:.22em;fill:#b0a5b8}
    .t{font:800 29px Manrope,system-ui,sans-serif;fill:#f7f3fb;letter-spacing:-.9px}
    .s{font:400 12px Manrope,system-ui,sans-serif;fill:#b0a5b8}
    .m{font:800 40px Manrope,system-ui,sans-serif;fill:#f0e6cf;letter-spacing:-1.5px}
    .ml{font:500 8px 'DM Mono',monospace;letter-spacing:.14em;fill:#9a8fa2}
    .mm{font:800 17px Manrope,system-ui,sans-serif;fill:#e6d9bd}
    .badge{font:700 8px 'DM Mono',monospace;letter-spacing:.12em;fill:#2a2016}
  </style>
  <text class="k" x="40" y="46">SEATTLE OS / PREDICTIVE MODELLING</text>

  <path d="M80 320a120 120 0 0 1 240 0" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="14" stroke-linecap="round"/>
  <path d="M80 320a120 120 0 0 1 240 0" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" stroke-dasharray="271 377"/>
  <line x1="200" y1="320" x2="261" y2="226" stroke="#f0e6cf" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="320" r="7" fill="#f0e6cf"/>
  <text class="m" x="200" y="290" text-anchor="middle">72%</text>
  <text class="ml" x="200" y="340" text-anchor="middle">FAILURE PROBABILITY</text>
  <rect x="166" y="356" width="68" height="20" rx="10" fill="#d8b56b"/>
  <text class="badge" x="200" y="370" text-anchor="middle">HIGH RISK</text>

  <text class="t" x="400" y="150">Predictive</text>
  <text class="t" x="400" y="182">Maintenance</text>
  <text class="s" x="400" y="206">Machine-failure risk from sensor inputs</text>

  <text class="mm" x="400" y="256">XGBoost</text><text class="ml" x="400" y="272">PREDICTION MODEL</text>
  <text class="mm" x="530" y="256">FastAPI</text><text class="ml" x="530" y="272">REST + SWAGGER</text>

  <g>
    <rect x="400" y="296" width="18" height="42" rx="3" fill="#d8b56b" fill-opacity=".35"/>
    <rect x="424" y="308" width="18" height="30" rx="3" fill="#d8b56b" fill-opacity=".5"/>
    <rect x="448" y="286" width="18" height="52" rx="3" fill="#d8b56b" fill-opacity=".7"/>
    <rect x="472" y="316" width="18" height="22" rx="3" fill="#d8b56b" fill-opacity=".4"/>
    <rect x="496" y="300" width="18" height="38" rx="3" fill="#d8b56b" fill-opacity=".55"/>
    <text class="ml" x="530" y="330">SENSOR SIGNALS</text>
  </g>

  <path d="M40 386h720" stroke="#ffffff" stroke-opacity=".09"/>
  <text class="ml" x="40" y="412">EDA · FEATURE ENGINEERING · SERIALIZED PIPELINE · DOCKER · RENDER</text>
  <text class="ml" x="640" y="412">CONSISTENT PREDICTIONS</text>
</svg>
