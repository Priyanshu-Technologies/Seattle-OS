  <text class="m" x="380" y="182">98.33%</text>
  <text class="ml" x="380" y="198">VALIDATION ACCURACY</text>

  <text class="mm" x="380" y="238">6</text><text class="ml" x="380" y="253">DEFECT CLASSES</text>
  <text class="mm" x="500" y="238">1,800</text><text class="ml" x="500" y="253">NEU-DET IMAGES</text>

  <text class="ml" x="380" y="292">DOMAIN GATE THRESHOLD</text>
  <text class="mm" x="380" y="314">τ 0.9551</text>

  <text class="ml" x="380" y="348">BELOW 70% CONFIDENCE → MANUAL INSPECTION</text>

  <path d="M40 386h720" stroke="#ffffff" stroke-opacity=".09"/>
  <text class="ml" x="40" y="412">RESNET18 TRANSFER LEARNING · CONFUSION MATRIX · PER-CLASS F1</text>
  <text class="ml" x="650" y="412">RENDER</text>
