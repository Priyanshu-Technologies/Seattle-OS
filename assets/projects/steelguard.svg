  <g>
    <rect x="40" y="146" width="88" height="88" rx="8" class="tile"/>
    <rect x="140" y="146" width="88" height="88" rx="8" class="tile" stroke="#7ed6a2" stroke-opacity=".85"/>
    <rect x="240" y="146" width="88" height="88" rx="8" class="tile"/>
    <rect x="40" y="246" width="88" height="88" rx="8" class="tile"/>
    <rect x="140" y="246" width="88" height="88" rx="8" class="tile" stroke="#e08a8a" stroke-opacity=".85"/>
    <rect x="240" y="246" width="88" height="88" rx="8" class="tile"/>
    <g stroke="#dbe9f2" stroke-opacity=".5" stroke-width="2" fill="none">
      <path d="M56 190l28 12-14 16 22 8"/>
      <path d="M156 186l30 6-12 20 26 12"/>
      <path d="M256 200l24-16 16 22-30 12"/>
      <path d="M56 286l22-14 20 20-28 14"/>
      <path d="M156 300l32-18-10 30"/>
      <path d="M256 280l26 16 18-22"/>
    </g>
    <text class="tag" x="176" y="176" fill="#7ed6a2">PASS 0.99</text>
    <text class="tag" x="150" y="326" fill="#e08a8a">GATE REJECT</text>
