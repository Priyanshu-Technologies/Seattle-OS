<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="SteelGuard AI: six steel defect classes, domain gate and validation accuracy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141a20"/><stop offset="1" stop-color="#25313c"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#8fb6cc" stop-opacity=".26"/><stop offset="1" stop-color="#8fb6cc" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0v30" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/><rect width="800" height="450" fill="url(#grid)"/><rect width="800" height="450" fill="url(#glow)"/>
  <style>
