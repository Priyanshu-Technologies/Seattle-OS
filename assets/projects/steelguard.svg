    .t{font:800 30px Manrope,system-ui,sans-serif;fill:#f2f7fa;letter-spacing:-.9px}
    .s{font:400 12px Manrope,system-ui,sans-serif;fill:#9fb3c2}
    .m{font:800 34px Manrope,system-ui,sans-serif;fill:#a9d2e6;letter-spacing:-1px}
    .ml{font:500 8px 'DM Mono',monospace;letter-spacing:.14em;fill:#8b9daa}
    .mm{font:800 18px Manrope,system-ui,sans-serif;fill:#d8e8f1}
    .tag{font:700 8px 'DM Mono',monospace;letter-spacing:.1em}
    .tile{fill:#8fb6cc;fill-opacity:.13;stroke:#ffffff;stroke-opacity:.16}
  </style>
  <text class="k" x="40" y="46">SEATTLE OS / INDUSTRIAL VISION</text>
  <text class="t" x="40" y="92">SteelGuard AI</text>
